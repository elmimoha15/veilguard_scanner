# Precision + recall gate. Fails the build if:
#  - any safe-corpus case produces a medium+ finding (a new false positive), or
#  - any vulnerable-corpus case stops firing or drops below its severity, or
#  - QuickCart stops grading F with its required criticals, the clean app stops
#    grading A/B, or public keys start being reported as secrets.
name: precision-gate
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run gate
      # Same pinned, checksum-verified engines as the scan worker
      # (veilguard-backend/worker/Dockerfile). Bump both together.
      - name: Install gitleaks 8.30.1 + osv-scanner 2.6.0
        run: |
          set -eux
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          sudo curl -fsSL -o /usr/local/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /usr/local/bin/osv-scanner" | sha256sum -c -
          sudo chmod +x /usr/local/bin/gitleaks /usr/local/bin/osv-scanner
      - run: npm run gate:engines
